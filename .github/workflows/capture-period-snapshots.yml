name: Capture Period Snapshots

on:
  schedule:
    - cron: "*/5 16-23,0-9 * * *"
    - cron: "0 10,12,14 * * *"
    - cron: "0 11,13,15 * * *"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify snapshot secrets
        id: snapshot-secrets
        shell: bash
        env:
          HAS_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL != '' }}
          HAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          if [ "$HAS_SUPABASE_URL" != "true" ] || [ "$HAS_SUPABASE_SERVICE_ROLE_KEY" != "true" ]; then
            echo "Snapshot secrets missing. Skipping run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        if: steps.snapshot-secrets.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify toolchain
        if: steps.snapshot-secrets.outputs.should_run == 'true'
        run: |
          node --version
          npm --version
      - name: Install dependencies
        if: steps.snapshot-secrets.outputs.should_run == 'true'
        env:
          NPM_CONFIG_ENGINE_STRICT: "false"
        run: npm ci --no-audit --no-fund --loglevel verbose || npm install --no-audit --no-fund --loglevel verbose
      - name: Capture snapshots
        if: steps.snapshot-secrets.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SNAPSHOT_WINDOW_MINUTES: 3
        run: node scripts/capture-period-snapshots.js
